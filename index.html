<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mallorca Cycling</title>

    <link rel="icon" type="image/png" href="media/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAfKHI_ppkXrqq9woohNzLDi1Zchlf5BEM&libraries=places,geometry,elevation"
        async defer></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#fc4c02',
                        secondary: '#2f353b',
                    },
                    fontFamily: {
                        title: ['Lexend', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="font-body text-gray-800 bg-[#fcfcfc] overflow-y-auto">
    <nav class="nav-container fixed top-0 w-full h-[80px] bg-white/95 backdrop-blur z-[1000] shadow-sm flex items-center">
        <div class="flex justify-between items-center w-full h-full mx-auto px-5 relative">
            <h2 class="text-primary italic font-title text-2xl font-bold">Mallorca Cycling</h2>
            <button
                class="nav-toggle md:hidden flex flex-col justify-center gap-[6px] p-2 bg-transparent border-none cursor-pointer group"
                aria-label="Toggle navigation" aria-expanded="false" data-action="toggle-mobile-menu">
                <span class="block w-6 h-[3px] rounded-full bg-secondary"></span>
                <span class="block w-6 h-[3px] rounded-full bg-secondary"></span>
                <span class="block w-6 h-[3px] rounded-full bg-secondary"></span>
            </button>
            <ul
                class="nav-menu hidden md:flex absolute md:relative top-full md:top-auto left-0 w-full md:w-auto bg-white md:bg-transparent flex-col md:flex-row items-stretch md:items-center p-5 md:p-0 gap-4 md:gap-6 border-t md:border-none border-gray-200 shadow-lg md:shadow-none [&.active]:flex">
                <li class="flex justify-center"><a href="/"
                        class="text-secondary font-bold uppercase py-2 md:py-0 hover:text-primary hover:underline transition-colors"
                        data-link>Home</a></li>
                <li class="flex justify-center"><a href="/map"
                        class="text-secondary font-bold uppercase py-2 md:py-0 hover:text-primary hover:underline transition-colors"
                        data-link>Map</a></li>
                <li class="flex justify-center"><a href="/segments"
                        class="text-secondary font-bold uppercase py-2 md:py-0 hover:text-primary hover:underline transition-colors"
                        data-link>Segments</a></li>
                <li class="flex justify-center md:ml-auto">
                    <div id="user-nav-area"></div>
                </li>
            </ul>
        </div>
    </nav>

    <main id="app-viewport" class="pt-[80px] min-h-[80vh]">
    </main>

    <footer class="text-center py-10 px-5 bg-[#f1f1f1] text-secondary">
        <p>By Pau and Jaume &copy; 2026 Mallorca Cycling</p>
    </footer>

    <script src="js/router.js" type="module"></script>
</body>

</html>
